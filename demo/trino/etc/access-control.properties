# Demo configuration — plugin for the local OPA demo deployment.
access-control.name=opa-access-control
opa.endpoint.url=http://opa:8181

# Demo bundle is the M5 safe-mode example policy.
opa.sql.mode=safe

# Demo defaults; tune for real deployments (see README.md).
opa.cache.ttl-seconds=30
opa.cache.negative-ttl-seconds=2
