# Release engineering (Milestone 7, item 2 — Q-B/Q-C).
#
# On a semantic-version tag (vMAJOR.MINOR.PATCH, e.g. v0.1.0):
#   - set the Maven version from the tag (strip the "v" prefix);
#   - build BOTH artifacts at that version: the unshaded plugin jar and the
#     shaded conformance-cli jar (M6 shade config in pom.xml);
#   - run the conformance-cli gate against the safe example as a pre-publish
#     sanity check;
#   - compute SHA-256 checksums + generate a changelog from git history;
#   - publish the two deployable jars + checksums + changelog to a GitHub Release;
#   - GPG-sign and publish to Maven Central via central-publishing-maven-plugin.
#
# Requires these repository secrets (Settings → Secrets → Actions):
#   CENTRAL_USERNAME  — Sonatype Central Portal user-token username
#   CENTRAL_PASSWORD  — Sonatype Central Portal user-token password
#   GPG_PRIVATE_KEY   — armored private key  (`gpg --armor --export-secret-keys <id>`)
#   GPG_PASSPHRASE    — passphrase for that key
name: Release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for the changelog (previous tag)

      - name: Set up JDK 25 (GPG + Central credentials)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set version from tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Install opa (>= 1.0)
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.6.0

      - name: Build both jars
        run: mvn -B package -DskipTests

      - name: Conformance gate — CLI jar vs safe example
        run: |
          java -jar "target/trino-opa-access-control-${VERSION}-conformance-cli.jar" conformance \
            --policy-dir policy-conformance-kit/examples/safe --mode safe

      - name: Compute checksums
        run: |
          cd target
          sha256sum "trino-opa-access-control-${VERSION}.jar" \
                     "trino-opa-access-control-${VERSION}-conformance-cli.jar" > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Release ${{ github.ref_name }}"
            echo ""
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"
              echo ""
              git log --oneline --no-decorate "$PREV..HEAD"
            else
              echo "Initial release."
              echo ""
              git log --oneline --no-decorate HEAD
            fi
          } > /tmp/CHANGELOG.md
          cat /tmp/CHANGELOG.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: /tmp/CHANGELOG.md
          files: |
            target/trino-opa-access-control-${{ env.VERSION }}.jar
            target/trino-opa-access-control-${{ env.VERSION }}-conformance-cli.jar
            target/SHA256SUMS

      - name: Publish to Maven Central
        run: mvn -B deploy -DskipTests
